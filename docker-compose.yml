version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source so --reload picks up changes
      - ./backend:/app
      # Persist Chroma vector data between restarts
      - rag_chroma:/app/chroma_data
    env_file:
      - ./backend/.env.local
    restart: unless-stopped

volumes:
  rag_chroma:
